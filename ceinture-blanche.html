<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ceinture blanche – 6ème – Calcul mental</title>
<style>
:root{--ink:#1b2a4a;--mut:#5b6785;--mat:#eef1f6;--line:#d5dbe7;--ok:#1f7a4d;--ko:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:18px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:0 0 .4em}h3{font-size:1rem;margin:0 0 .5em}
p{margin:.4em 0}.sub{color:var(--mut)}
.cards,.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--mat);border-radius:10px;padding:14px 16px}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:.5em 1.2em}
button.alt{background:#fff;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid #6d8fd6;outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;position:sticky;top:0;background:#fff;padding:8px 0 4px;z-index:1}
.time{font-weight:700;font-variant-numeric:tabular-nums}.time.low{color:var(--ko)}
.bar{height:10px;background:var(--mat);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.big{font-size:clamp(2rem,9vw,3.4rem);font-weight:700;text-align:center;margin:.9em 0 .6em;font-variant-numeric:tabular-nums}
input{font:inherit;width:5em;padding:.25em .3em;border:2px solid var(--line);border-radius:8px;text-align:center;color:var(--ink)}
.big input{font-size:inherit;width:3.4em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:.45em 0;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.score{font-size:2.4rem;font-weight:700;margin:.1em 0 .4em}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.actions.c{justify-content:center}
</style></head><body><main id="app"></main>
<script>
const TITRE="Ceinture blanche – 6ème";
const THEMES=[{"id": "A", "nom": "Table de 2"}, {"id": "B", "nom": "Table de 11"}, {"id": "C", "nom": "Table de 5"}, {"id": "D", "nom": "Ajouter 9, 19, 29, 39"}, {"id": "E", "nom": "Compléments à 100"}];
const BANQUE={"A":[["2 × 3","6"],["2 × 4","8"],["2 × 5","10"],["2 × 6","12"],["2 × 7","14"],["2 × 8","16"],["2 × 9","18"],["2 × 10","20"],["2 × 11","22"],["2 × 12","24"]],"B":[["11 × 3","33"],["11 × 4","44"],["11 × 5","55"],["11 × 6","66"],["11 × 7","77"],["11 × 8","88"],["11 × 9","99"],["11 × 10","110"],["11 × 11","121"],["11 × 12","132"]],"C":[["5 × 3","15"],["5 × 4","20"],["5 × 5","25"],["5 × 6","30"],["5 × 7","35"],["5 × 8","40"],["5 × 9","45"],["5 × 10","50"],["5 × 11","55"],["5 × 12","60"]],"D":[["48 + 19","67"],["62 + 29","91"],["75 + 39","114"],["9 + 54","63"],["32 + 9","41"],["29 + 84","113"],["19 + 76","95"],["39 + 58","97"],["29 + 56","85"],["39 + 87","126"],["9 + 72","81"],["19 + 45","64"],["19 + 82","101"],["29 + 79","108"],["35 + 39","74"],["9 + 58","67"],["19 + 33","52"],["75 + 9","84"],["44 + 29","73"],["39 + 86","125"],["9 + 66","75"],["29 + 85","114"],["73 + 39","112"],["19 + 38","57"],["62 + 9","71"],["85 + 39","124"],["49 + 29","78"],["19 + 54","73"],["9 + 84","93"],["57 + 29","86"],["39 + 33","72"],["86 + 9","95"],["47 + 19","66"],["68 + 39","107"],["52 + 29","81"],["59 + 19","78"],["29 + 73","102"],["86 + 39","125"],["9 + 47","56"],["39 + 43","82"],["74 + 9","83"],["29 + 62","91"],["87 + 19","106"],["87 + 39","126"],["33 + 9","42"],["19 + 42","61"],["29 + 78","107"],["63 + 19","82"],["39 + 32","71"],["29 + 55","84"],["76 + 9","85"],["52 + 39","91"],["9 + 43","52"],["9 + 53","62"],["66 + 29","95"],["39 + 79","118"],["29 + 86","115"],["19 + 62","81"],["58 + 39","97"],["9 + 75","84"],["29 + 49","78"],["19 + 64","83"],["9 + 85","94"],["37 + 39","76"],["33 + 29","62"],["68 + 19","87"],["54 + 39","93"],["77 + 9","86"],["54 + 29","83"],["79 + 19","98"],["29 + 48","77"],["9 + 78","87"],["55 + 29","84"],["39 + 36","75"],["37 + 9","46"],["19 + 88","107"],["29 + 44","73"],["39 + 62","101"],["9 + 74","83"],["65 + 29","94"],["89 + 19","108"],["79 + 9","88"],["32 + 29","61"],["79 + 39","118"],["19 + 46","65"],["9 + 82","91"],["19 + 52","71"],["29 + 39","68"],["39 + 63","102"],["78 + 39","117"],["63 + 29","92"],["9 + 68","77"],["29 + 59","88"],["75 + 19","94"],["66 + 9","75"],["39 + 55","94"],["43 + 29","72"],["32 + 19","51"],["9 + 87","96"],["66 + 39","105"],["29 + 66","95"],["43 + 19","62"],["9 + 32","41"],["39 + 84","123"],["37 + 19","56"],["64 + 9","73"],["29 + 82","111"],["33 + 19","52"],["59 + 29","88"],["9 + 64","73"],["39 + 45","84"],["19 + 47","66"],["29 + 72","101"],["39 + 34","73"],["77 + 29","106"],["39 + 89","128"],["9 + 62","71"],["82 + 19","101"],["77 + 39","116"],["35 + 9","44"]],"E":[["100 − 28","72"],["100 − 43","57"],["100 − 85","15"],["100 − 72","28"],["100 − 11","89"],["100 − 84","16"],["100 − 63","37"],["100 − 19","81"],["100 − 38","62"],["100 − 79","21"],["100 − 12","88"],["100 − 86","14"],["100 − 66","34"],["100 − 49","51"],["100 − 52","48"],["100 − 24","76"],["100 − 82","18"],["100 − 74","26"],["100 − 87","13"],["100 − 61","39"],["100 − 37","63"],["100 − 75","25"],["100 − 16","84"],["100 − 89","11"],["100 − 56","44"],["100 − 44","56"],["100 − 69","31"],["100 − 59","41"],["100 − 35","65"],["100 − 67","33"],["100 − 57","43"],["100 − 22","78"],["100 − 55","45"],["100 − 32","68"],["100 − 47","53"],["100 − 36","64"],["100 − 83","17"],["100 − 77","23"],["100 − 46","54"],["100 − 18","82"],["100 − 81","19"],["100 − 42","58"],["100 − 51","49"],["100 − 14","86"],["100 − 62","38"],["100 − 23","77"],["100 − 88","12"],["100 − 29","71"],["100 − 34","66"],["100 − 73","27"],["100 − 27","73"],["100 − 78","22"],["100 − 39","61"],["100 − 68","32"],["100 − 45","55"],["100 − 58","42"],["100 − 76","24"],["100 − 48","52"],["100 − 31","69"],["100 − 41","59"],["100 − 65","35"],["100 − 17","83"],["100 − 15","85"],["100 − 64","36"]]};
const T_ENTR=75, T_THEME=60, T_TEST=300;   // secondes, pour l'ensemble des calculs : entraînement 1 min 15 s / un thème 1 min / test 5 min
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).replace(/[\s\u00a0\u202f]/g,'').replace(',','.');
const same=(a,b)=>norm(a)!==''&&Number(norm(a))===Number(norm(b));
const chrono=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let timer=null;
const tirage=n=>THEMES.flatMap(t=>shuffle(BANQUE[t.id]).slice(0,n).map(([q,r])=>({t:t.id,q,r,a:''})));
function lance(total,fin,fini){
  const tick=()=>{const s=Math.max(0,Math.ceil((fin-Date.now())/1000));
    $('#tm').textContent=chrono(s);$('#tm').classList.toggle('low',s<=10);$('#pb').style.width=100*s/total+'%';
    if(s<=0)fini()};
  clearInterval(timer);tick();timer=setInterval(tick,250);
}
function menu(){
  clearInterval(timer);
  app.innerHTML=`<h1>${esc(TITRE)}</h1><p class="sub">Calcul mental : choisis ton mode.</p>
  <div class="cards"><div class="card"><h2>Entraînement</h2><p>${THEMES.length} calculs (1 par thème) en ${Math.floor(T_ENTR/60)} min ${T_ENTR%60} s.</p><button id="m1">Commencer</button></div>
  <div class="card"><h2>Un seul thème</h2><p>4 calculs du thème choisi en ${T_THEME/60} min.</p>${THEMES.map(t=>`<div class="row"><button class="alt th" data-t="${t.id}">${esc(t.nom)}</button></div>`).join('')}</div>
  <div class="card"><h2>Test d'entraînement</h2><p>${4*THEMES.length} calculs (4 par thème) en ${T_TEST/60} minutes.</p><button id="m2">Commencer</button></div></div>
  <p class="sub">La correction et le score s'affichent à la fin.</p>`;
  $('#m1').onclick=entrainement;$('#m2').onclick=test;
  app.querySelectorAll('.th').forEach(b=>b.onclick=()=>theme(b.dataset.t));
}
const entrainement=()=>serie(tirage(1),T_ENTR,'Entraînement',entrainement);
function theme(id){
  const t=THEMES.find(x=>x.id===id);
  serie(shuffle(BANQUE[id]).slice(0,4).map(([q,r])=>({t:id,q,r,a:''})),T_THEME,'Un seul thème : '+t.nom,()=>theme(id),[t]);
}
// Calculs affichés un par un ; un seul chrono pour toute la série, jamais remis à zéro
function serie(L,total,mode,rejouer,themes){
  let i=0;const fini=()=>{clearInterval(timer);correction(L,mode,rejouer,themes)};
  const show=()=>{
    app.innerHTML=`<div class="top"><b>Calcul ${i+1} / ${L.length}</b><span class="time" id="tm"></span></div><div class="bar"><i id="pb"></i></div>
    <div class="big">${esc(L[i].q)} = <input id="in" inputmode="numeric" autocomplete="off" aria-label="Ta réponse"></div>
    <div class="actions c"><button id="ok">Valider</button></div>`;
    const inp=$('#in');inp.focus();
    const next=()=>{L[i].a=inp.value;++i<L.length?show():fini()};
    $('#ok').onclick=next;inp.onkeydown=e=>{if(e.key==='Enter')next()};
  };
  show();lance(total,Date.now()+total*1000,()=>{L[i].a=($('#in')||{}).value||'';fini()});
}
function test(){
  const L=tirage(4);let sure=false;
  app.innerHTML=`<div class="top"><b>Test d'entraînement</b><span class="time" id="tm"></span></div><div class="bar"><i id="pb"></i></div>
  <div class="grid" style="margin-top:12px">${THEMES.map(t=>`<div class="card"><h3>${esc(t.nom)}</h3>${L.map((x,k)=>x.t===t.id?`<div class="row"><span>${esc(x.q)} =</span><input data-k="${k}" inputmode="numeric" autocomplete="off" aria-label="${esc(x.q)}"></div>`:'').join('')}</div>`).join('')}</div>
  <div class="actions"><button id="fin">Terminer</button><span id="msg" class="sub"></span></div>`;
  const ins=[...app.querySelectorAll('input')];ins[0].focus();
  ins.forEach((el,n)=>el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();(ins[n+1]||$('#fin')).focus()}});
  const end=()=>{clearInterval(timer);ins.forEach(el=>{L[el.dataset.k].a=el.value});correction(L,"Test d'entraînement",test)};
  $('#fin').onclick=()=>{const v=ins.filter(e=>!e.value.trim()).length;
    if(v&&!sure){sure=true;$('#msg').textContent=`${v} calcul(s) sans réponse : clique encore pour terminer.`;return}end()};
  lance(T_TEST,Date.now()+T_TEST*1000,end);
}
function correction(L,mode,rejouer,themes=THEMES){
  clearInterval(timer);
  const ok=x=>same(x.a,x.r), n=L.filter(ok).length;
  app.innerHTML=`<h1>Correction : ${esc(mode)}</h1><p class="score">${n} / ${L.length}</p>
  <div class="grid">${themes.map(t=>{const s=L.filter(x=>x.t===t.id);
    return `<div class="card"><h3>${esc(t.nom)} : ${s.filter(ok).length} / ${s.length}</h3><div class="res">${s.map(x=>`<span>${esc(x.q)} = <b>${esc(x.r)}</b></span><span class="${ok(x)?'ok':'ko'}">${esc(x.a.trim())||'—'}</span><span class="${ok(x)?'ok':'ko'}" role="img" aria-label="${ok(x)?'juste':'faux'}">${ok(x)?'✓':'✗'}</span>`).join('')}</div></div>`}).join('')}</div>
  <div class="actions"><button id="re">Rejouer</button><button class="alt" id="mn">Menu</button></div>`;
  $('#re').onclick=rejouer;$('#mn').onclick=menu;
}
menu();
</script></body></html>
